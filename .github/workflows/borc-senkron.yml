# ESKİ AD — UYUMLULUK KÖPRÜSÜ (2026-09-19, TB-001)
#
# Gerçek iş `debt-sync.yml` içindedir. Bu dosya yalnız çağrıyı oraya iletir.
# Ana dalda 1 proje bu adla çağırıyor (2026-09-19 ölçümü).
# Silme koşulu: `node quality/workflow-callers.js` sıfır çağıran gösterdiğinde.
name: borc-senkron (eski ad)

on:
  workflow_call:
    inputs:
      uygula:
        description: "ESKİ AD — yerine `debt-sync.yml` + `apply` kullanın"
        type: boolean
        default: true
      standart_surumu:
        description: "ESKİ AD — yerine `standards_ref` kullanın"
        type: string
        default: main
    secrets:
      PROJECT_TOKEN:
        description: "Board'a yazma anahtarı. Yoksa board atlanır, issue senkronu yine çalışır."
        required: false

jobs:
  bridge:
    permissions:
      contents: read
      issues: write
    uses: sinanbocek/SNN-Standartlar/.github/workflows/debt-sync.yml@main
    with:
      apply: ${{ inputs.uygula }}
      standards_ref: ${{ inputs.standart_surumu }}
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
