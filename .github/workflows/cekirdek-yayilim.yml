# ESKİ AD — UYUMLULUK KÖPRÜSÜ (2026-09-19, TB-001)
#
# Gerçek iş `core-propagate.yml` içindedir. Bu dosya yalnız çağrıyı oraya iletir.
# Ana dalda 1 proje (çekirdek deposu) bu adla çağırıyor (2026-09-19 ölçümü).
# Silme koşulu: `node quality/workflow-callers.js` sıfır çağıran gösterdiğinde.
name: cekirdek-yayilim (eski ad)

on:
  workflow_call:
    inputs:
      surum:
        description: "ESKİ AD — yerine `core-propagate.yml` + `version` kullanın"
        type: string
        required: true
      uygula:
        description: "ESKİ AD — yerine `apply` kullanın"
        type: boolean
        default: true
      yalniz:
        description: "ESKİ AD — yerine `only` kullanın"
        type: string
        default: ""
      standart_surumu:
        description: "ESKİ AD — yerine `standards_ref` kullanın"
        type: string
        default: main
    secrets:
      PROJECT_TOKEN:
        description: "Tüketici depolarda dal ve PR açabilen anahtar"
        required: true

jobs:
  bridge:
    permissions:
      contents: read
    uses: sinanbocek/SNN-Standartlar/.github/workflows/core-propagate.yml@main
    with:
      version: ${{ inputs.surum }}
      apply: ${{ inputs.uygula }}
      only: ${{ inputs.yalniz }}
      standards_ref: ${{ inputs.standart_surumu }}
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
