# ESKİ AD — UYUMLULUK KÖPRÜSÜ (2026-09-19, TB-001)
#
# Gerçek iş `secret-scan.yml` içindedir. Bu dosya yalnız çağrıyı oraya iletir.
#
# NEDEN VAR: bu akışı 10 projenin HEPSİ bu adla çağırıyor (2026-09-19'da ana daldan ölçüldü).
# Adı doğrudan değiştirmek 10 projenin kapısını aynı anda kırardı. Köprü sayesinde hiçbir
# projede dosya değiştirmek gerekmedi.
#
# NE ZAMAN SİLİNİR: her tüketici kendi çağrısını `secret-scan.yml`e çevirdiğinde. Ölçüm:
#   node quality/workflow-callers.js
# Sıfır çağıran kaldığında bu dosya silinir. Kendiliğinden silinmez; ölçüm gösterince silinir.
name: anahtar-tarama (eski ad)

on:
  workflow_call:
    inputs:
      standart_surumu:
        description: "ESKİ AD — yerine `secret-scan.yml` + `standards_ref` kullanın"
        type: string
        default: main

jobs:
  bridge:
    permissions:
      contents: read
    uses: sinanbocek/SNN-Standartlar/.github/workflows/secret-scan.yml@main
    with:
      standards_ref: ${{ inputs.standart_surumu }}
