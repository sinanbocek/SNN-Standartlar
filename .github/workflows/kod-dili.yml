# ESKİ AD — UYUMLULUK KÖPRÜSÜ (2026-09-19, TB-001)
#
# Gerçek iş `code-language.yml` içindedir. Bu dosya yalnız çağrıyı oraya iletir.
# Ana dalda 1 proje bu adla çağırıyor (2026-09-19 ölçümü).
# Silme koşulu: `node quality/workflow-callers.js` sıfır çağıran gösterdiğinde.
name: kod-dili (eski ad)

on:
  workflow_call:
    inputs:
      standart_surumu:
        description: "ESKİ AD — yerine `code-language.yml` + `standards_ref` kullanın"
        type: string
        default: main

jobs:
  bridge:
    permissions:
      contents: read
    uses: sinanbocek/SNN-Standartlar/.github/workflows/code-language.yml@main
    with:
      standards_ref: ${{ inputs.standart_surumu }}
