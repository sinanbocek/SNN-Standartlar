# Ortak görevli: teknik borç kütüğü → GitHub issue + board senkronu.
# Projeler bunu doğrudan çalıştırmaz; kendi .github/workflows/teknik-borc.yml dosyalarından çağırır (ornek/teknik-borc.yml).
name: debt-sync

on:
  workflow_call:
    inputs:
      apply:
        description: "false ise yalnız kuru çalıştırma (hiçbir şey değişmez)"
        type: boolean
        default: true
      standards_ref:
        description: "snn-standartlar deposundan kullanılacak dal/etiket"
        type: string
        default: main
    secrets:
      PROJECT_TOKEN:
        description: "Board'a yazma anahtarı (klasik PAT, project yetkisi). Yoksa board atlanır, issue senkronu yine çalışır."
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Proje deposunu al
        uses: actions/checkout@v4

      - name: Ortak senkron betiğini al
        uses: actions/checkout@v4
        with:
          repository: sinanbocek/SNN-Standartlar
          ref: ${{ inputs.standards_ref }}
          path: .snn-standartlar

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kütüğü GitHub'a aynala
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          UYGULA: ${{ inputs.apply }}
        run: |
          if [ ! -f docs/teknik-borc.md ]; then
            echo "docs/teknik-borc.md yok — bu projede kütük standart biçimde değil, senkron atlandı." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARGS=". --ci"
          if [ "$UYGULA" = "true" ]; then ARGS="$ARGS --uygula"; fi
          set -o pipefail
          node .snn-standartlar/debt-sync/debt-sync.js $ARGS 2>&1 | tee senkron.log
          { echo '### Teknik borç senkronu'; echo '```'; cat senkron.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
