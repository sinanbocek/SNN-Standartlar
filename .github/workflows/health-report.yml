# Haftalık sağlık raporu — SAYILAR bölümü, issue olarak.
#
# NEDEN VAR (2026-09-23, proje sahibi kararı): haftalık e-posta raporu 7 sütunlu bir tablo
# basıyordu; iki sütun 10 projenin 10'unda da "okunamadı" diyordu, maddeler paragraftı ve önem
# derecesi yoktu. Karar: "özet hap bilgi".
#
# İŞ BÖLÜMÜ: bu akış SAYIYI üretir (makine ölçer). E-posta rutini YORUMU yapar — hangi üç şey bu
# hafta önemli. Rutin de sayıları buradan alır; böylece iki ayrı yerde iki farklı sayı olmaz.
# Eski raporda kütük BAŞLIĞI kullanılıyordu ve üç projede dosya içeriğiyle uyuşmuyordu.
#
# Kendi kotasını yakmaz: SNN-Standartlar herkese açık.
name: health-report

on:
  workflow_dispatch:
  schedule:
    - cron: "9 5 * * 1" # her Pazartesi 08:09 TSİ — e-posta rutininden ÖNCE, sayılar hazır olsun

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sayıları ölç
        env:
          # Kota satırı faturalama API'si ister (`user` yetkisi); PROJECT_TOKEN kullanılır.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          node quality/health-report.js > sayilar.txt 2>&1 || true
          cat sayilar.txt
          { echo '### Haftalık sağlık — sayılar'; echo '```'; cat sayilar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Issue olarak yaz
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          TITLE="[SAĞLIK] $(date -u +%d.%m.%Y) haftalık sayılar"
          BODY="$(cat sayilar.txt)"
          # AYNI issue GÜNCELLENİR, her hafta yenisi açılmaz: 52 issue/yıl gürültüdür.
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --label saglik -s open --limit 1 --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body "Güncellendi — $(date -u +%d.%m.%Y)"
            echo "güncellendi: #$EXISTING"
          else
            gh label create saglik -R "$GITHUB_REPOSITORY" --color 1D76DB --description "Haftalık sağlık sayıları" 2>/dev/null || true
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --label saglik
          fi
