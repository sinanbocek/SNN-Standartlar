# Ortak deponun kendi kontrolü: senkron planı testleri
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Senkron testleri
        run: node debt-sync/test/sync.test.js
      - name: Uçtan uca (sahte gh ile istek hakkı ve board maliyeti)
        run: node debt-sync/test/sync-e2e.test.js
      - name: Rehber tazelik testleri
        run: node quality/test/guide-freshness.test.js
      - name: Şema belgesi bekçisi testleri
        run: node quality/test/schema-doc.test.js
      - name: Birleştirme kapısı testleri
        run: node quality/test/merge-gate.test.js
      - name: Unutulan iş testleri
        run: node debt-sync/test/forgotten-work.test.js
      - name: Güvenlik uyarıları testleri
        run: node quality/test/security-alerts.test.js
      - name: Çekirdek yayılım planı testleri
        run: node core/test/propagate-plan.test.js
      - name: Çekirdek yayılım sözdizimi
        run: node --check core/propagate.js
      - name: Proje kurulum planı testleri
        run: node setup/test/setup-plan.test.js
      - name: Proje kurulum sözdizimi
        run: node --check setup/setup-project.js
      - name: Akış dosyası yazım denetimi
        run: node quality/test/workflow-files.test.js
      - name: Anahtar taraması testleri
        run: node quality/test/secret-scan.test.js
      - name: Kod dili taraması testleri
        run: node quality/test/code-language-scan.test.js
      - name: Oturum defteri testleri
        run: node quality/test/session-registry.test.js
      - name: Geniş etkili git komutu testleri
        run: node quality/test/wide-effect-git.test.js
      - name: Bu PR'da eklenen satırlarda gizli anahtar (kendi kendini tarama)
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin ${{ github.event.pull_request.base.sha }}
          node quality/secret-scan.js --diff ${{ github.event.pull_request.base.sha }}
      - name: Sözdizimi
        run: node --check debt-sync/debt-sync.js
      - name: ESM projede çalışma (tüketen package.json "type":"module" olsa da)
        run: |
          mkdir -p /tmp/esm/.snn-standartlar && echo '{"type":"module"}' > /tmp/esm/package.json
          cp -r debt-sync /tmp/esm/.snn-standartlar/
          cd /tmp/esm && node .snn-standartlar/debt-sync/lib/sync-plan.js
