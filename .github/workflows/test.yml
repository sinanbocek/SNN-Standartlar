# Ortak deponun kendi kontrolü: senkron planı testleri
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Senkron testleri
        run: node borc-senkron/test/senkron.test.js
      - name: Uçtan uca (sahte gh ile istek hakkı ve board maliyeti)
        run: node borc-senkron/test/senkron-e2e.test.js
      - name: Rehber tazelik testleri
        run: node kalite/test/rehber-tazelik.test.js
      - name: Şema belgesi bekçisi testleri
        run: node kalite/test/sema-belgesi.test.js
      - name: Birleştirme kapısı testleri
        run: node kalite/test/birlestirme-kapisi.test.js
      - name: Unutulan iş testleri
        run: node borc-senkron/test/unutulan-is.test.js
      - name: Sözdizimi
        run: node --check borc-senkron/borc-senkron.js
      - name: ESM projede çalışma (tüketen package.json "type":"module" olsa da)
        run: |
          mkdir -p /tmp/esm/.snn-standartlar && echo '{"type":"module"}' > /tmp/esm/package.json
          cp -r borc-senkron /tmp/esm/.snn-standartlar/
          cd /tmp/esm && node .snn-standartlar/borc-senkron/lib/senkron-plan.js
