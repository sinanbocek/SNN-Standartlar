# YALNIZ çekirdek deposuna konacak dosya: .github/workflows/cekirdek-yayilim.yml
# Çekirdek, SNN-Standartlar'da core/data/cores.json listesinde olmalı (bugün: SNN-Abacus-Core, SNN-Piyasa-Core).
# Etiketi atan akış PROJECT_TOKEN ile göndermeli: GITHUB_TOKEN ile gönderilen etiket bu akışı TETİKLEMEZ.
# Yeni sürüm etiketi (v1.2.3) gönderilince, çekirdeği kullanan her projeye güncelleme PR'ı açılır.
# Elle tetikleme: önce "uygula" işaretsiz (yalnız plan), sonra işaretli.
name: cekirdek-yayilim

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      surum:
        description: "Yayılacak sürüm (ör. v3.3.0)"
        type: string
        required: true
      uygula:
        description: "İşaretsizse yalnız plan"
        type: boolean
        default: false
      yalniz:
        description: "Yalnız bu depo (boş = tüm tüketiciler)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cekirdek-yayilim
  cancel-in-progress: false

jobs:
  yay:
    uses: sinanbocek/SNN-Standartlar/.github/workflows/core-propagate.yml@main
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.surum }}
      apply: ${{ github.event_name == 'push' || inputs.uygula }}
      only: ${{ github.event_name == 'push' && '' || inputs.yalniz }}
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
