# ESKİ ŞABLON (2026-09-29): yeni projeye KOPYALANMAZ. Yerine: CI'ı olan proje ortak adımı CI işine
# ekler (ornek/ci-duzeni.yml); CI'ı olmayan proje ornek/aile-kontrol.yml kopyalar. Ayrı akış ayrı
# makine açar ve 15 saniyelik tarama 1 dakika faturalanır (docs/actions-kotasi.md). Bu dosya, onu
# hâlâ taşıyan projeler geçene kadar başvuru için durur.
#
# Her projeye kopyalanacak TEK dosya: .github/workflows/anahtar-tarama.yml
# Her PR'da ve main'e her gönderimde, EKLENEN satırlarda gizli anahtar arar. Bulursa kırmızı verir;
# birleştirme kapısı (bilgisayardaki bekçi) kırmızı kontrollü PR'ın birleştirilmesine izin vermez.
name: anahtar-tarama

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tara:
    uses: sinanbocek/SNN-Standartlar/.github/workflows/secret-scan.yml@main
